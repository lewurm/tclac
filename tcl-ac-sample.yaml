esphome:
  name: tcl-ac
  friendly_name: TCL AC
  min_version: 2026.4.0
  name_add_mac_suffix: false

esp32:
  board: m5stack-atoms3  # adjust for your board
  variant: esp32s3
  framework:
    type: arduino

logger:
  level: INFO
  baud_rate: 0

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

external_components:
  - source:
      url: https://github.com/rozenofu/tclac.git
      type: git
      ref: master
    components: [ tclac ]
    refresh: 30s

uart:
  id: ac_uart
  rx_pin: GPIO7  # adjust for your board
  tx_pin: GPIO8  # adjust for your board
  baud_rate: 9600
  data_bits: 8
  parity: EVEN
  stop_bits: 1

climate:
  - platform: tclac
    id: tcl_ac
    name: "TCL AC"
    uart_id: ac_uart

    # Boot defaults sent to the AC on first UART contact.
    # Add the switch: platform below to toggle these from HA at runtime.
    beeper: false
    show_display: true

    # Remove modes not supported by your unit
    supported_modes:
      - "OFF"
      - AUTO
      - COOL
      - HEAT
      - DRY
      - FAN_ONLY

    # Remove speeds not supported by your unit
    # FOCUS = faster than HIGH, DIFFUSE = turbo
    supported_fan_modes:
      - AUTO
      - QUIET
      - LOW
      - MIDDLE
      - MEDIUM
      - HIGH
      - FOCUS
      - DIFFUSE

    supported_swing_modes:
      - "OFF"
      - VERTICAL
      - HORIZONTAL
      - BOTH

    # Experimental diagnostics. The byte meanings are verified only on a
    # TAC-12CHSD/HCI; enable diagnostic_hex first on other revisions.
    compressor_running:
      name: "TCL AC Compressor Running"
    compressor_frequency:
      name: "TCL AC Compressor Frequency"
    diagnostic_hex:
      name: "TCL AC Diagnostic Hex"

# Optional: dropdown entities for fixed louver positions.
# "Swing" hands the axis back to the climate swing_mode.
select:
  - platform: tclac
    tclac_id: tcl_ac
    vertical_louver:
      name: "TCL AC Vertical Louver"
    horizontal_louver:
      name: "TCL AC Horizontal Louver"

# Optional: runtime toggles for the AC beeper and front-panel display.
switch:
  - platform: tclac
    tclac_id: tcl_ac
    beeper:
      name: "TCL AC Beeper"
    display:
      name: "TCL AC Display"
