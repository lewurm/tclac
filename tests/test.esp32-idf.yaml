esphome:
  name: tclac-test-idf

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:

uart:
  id: tclac_test_uart
  tx_pin: GPIO17
  rx_pin: GPIO16
  baud_rate: 9600
  data_bits: 8
  parity: EVEN
  stop_bits: 1

external_components:
  - source:
      type: local
      path: ../components
    components: [tclac]

climate:
  - platform: tclac
    id: tclac_test_climate
    name: TCL AC Test
    compressor_running:
      name: TCL AC Compressor Running
    compressor_frequency:
      name: TCL AC Compressor Frequency
    diagnostic_hex:
      name: TCL AC Diagnostic Hex

select:
  - platform: tclac
    tclac_id: tclac_test_climate
    vertical_louver:
      name: TCL AC Vertical Louver
    horizontal_louver:
      name: TCL AC Horizontal Louver

switch:
  - platform: tclac
    tclac_id: tclac_test_climate
    beeper:
      name: TCL AC Beeper
    display:
      name: TCL AC Display

# Exercises automation.h (all climate.tclac.* actions).
button:
  - platform: template
    name: TCL AC Test Actions
    on_press:
      - climate.tclac.beeper_on: tclac_test_climate
      - climate.tclac.beeper_off: tclac_test_climate
      - climate.tclac.display_on: tclac_test_climate
      - climate.tclac.display_off: tclac_test_climate
      - climate.tclac.set_vertical_airflow:
          id: tclac_test_climate
          vertical_airflow: DOWN
      - climate.tclac.set_horizontal_airflow:
          id: tclac_test_climate
          horizontal_airflow: MAX_LEFT
      - climate.tclac.set_vertical_swing_direction:
          id: tclac_test_climate
          vertical_swing_mode: UPSIDE
      - climate.tclac.set_horizontal_swing_direction:
          id: tclac_test_climate
          horizontal_swing_mode: LEFTSIDE
