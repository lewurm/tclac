esphome:
  name: tclac-test-idf

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:

uart:
  id: tclac_test_uart
  tx_pin: GPIO17
  rx_pin: GPIO16
  baud_rate: 9600
  data_bits: 8
  parity: EVEN
  stop_bits: 1

external_components:
  - source:
      type: local
      path: ../components
    components: [tclac]

climate:
  - platform: tclac
    id: tclac_test_climate
    name: TCL AC Test

select:
  - platform: tclac
    tclac_id: tclac_test_climate
    vertical_louver:
      name: TCL AC Vertical Louver
    horizontal_louver:
      name: TCL AC Horizontal Louver

# Exercises automation.h (the climate.tclac.* actions).
button:
  - platform: template
    name: TCL AC Test Actions
    on_press:
      - climate.tclac.set_vertical_airflow:
          id: tclac_test_climate
          vertical_airflow: DOWN
      - climate.tclac.set_horizontal_swing_direction:
          id: tclac_test_climate
          horizontal_swing_mode: LEFTSIDE
